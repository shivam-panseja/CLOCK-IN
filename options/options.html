<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Keka Auto-Login Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 20px;
      width: 320px;
      color: #333;
    }
    h2 { font-size: 1.2rem; margin-top: 0; color: #1a73e8; }
    .field { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .hint { font-size: 0.8rem; color: #666; margin-top: 4px; display: block; }
    button {
      background-color: #1a73e8;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      font-weight: 600;
    }
    button:hover { background-color: #1557b0; }
    .status {
      margin-top: 10px;
      padding: 8px;
      background-color: #e6f4ea;
      color: #1e8e3e;
      border-radius: 4px;
      font-size: 0.85rem;
      text-align: center;
      display: none;
    }
    .footer { margin-top: 20px; font-size: 0.75rem; color: #999; text-align: center; }
  </style>
</head>
<body>
  <h2>Keka Auto-Login</h2>
  
  <div class="field">
    <label>
      <input type="checkbox" id="enabled"> Enable Auto-Login
    </label>
  </div>

  <div class="field">
    <label for="email">Target Google Email</label>
    <input type="text" id="email" placeholder="e.g. yourname@company.com">
    <span class="hint">The extension will auto-click this account if multiple exist.</span>
  </div>

  <button id="save">Save Settings</button>
  
  <div id="status" class="status">Settings saved successfully!</div>

  <div class="footer">
    Requires an active Google session in Chrome.
  </div>

  <script src="options.js"></script>
</body>
</html>
